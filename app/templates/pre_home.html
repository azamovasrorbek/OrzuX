{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrzuX | Explore Your Future</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007aff;
            --soft-blue: #eef6ff;
            --text-dark: #1d1d1f;
            --glass: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #ffffff;
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #e0f2fe, #ffffff);
        }

        /* Asosiy konteyner: Ikkita katta card-ga bo'linadi */
        .split-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* Chap tomon biroz kengroq */
            width: 90%;
            max-width: 1200px;
            height: 70vh;
            gap: 25px;
        }

        /* Chap tomon: OrzuX haqida ma'lumot */
        .info-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 60px;
            border: 1px solid white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .logo-tag {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 1;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        h1 span { color: var(--primary); }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 40px;
        }

        /* O'ng tomon: Rasm uchun card */
        .image-card {
            position: relative;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            border: 1px solid white;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Rasm card-ni to'liq to'ldiradi */
            transition: transform 0.6s cubic-bezier(0.33, 1, 0.68, 1);
        }

        .image-card:hover img {
            transform: scale(1.05);
        }

        /* Rasm ustidagi "Founder" yozuvi */
        .founder-overlay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .founder-name { font-weight: 800; font-size: 1.1rem; display: block; }
        .founder-title { font-size: 0.8rem; color: var(--primary); font-weight: 700; text-transform: uppercase; }

        /* Explore Tugmasi */
        .explore-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 35px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 100px;
            font-weight: 700;
            width: fit-content;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.2);
        }

        .explore-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 122, 255, 0.4);
        }

        @media (max-width: 900px) {
            .split-layout { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
            .image-card { height: 400px; order: -1; } /* Mobilda rasm tepaga chiqadi */
        }
    </style>
</head>
<body>

    <div class="split-layout">

        <!-- Chap tomondagi card -->
        <div class="info-card">
            <div class="logo-tag">OrzuX Ecosystem</div>
            <h1>Unlimit Your <span>Potential.</span></h1>
            <p>Xalqaro musobaqalar, nufuzli stajirovkalar va ko'ngillilar harakatini bir joyda jamlagan eksklyuziv platforma. Kelajagingizni bugun quring.</p>

            <a href="{% url 'home' %}" class="explore-btn">
                Let's Explore <i class="fas fa-arrow-right"></i>
            </a>
        </div>

        <!-- O'ng tomondagi card (Sizning rasm) -->
        <div class="image-card">
            <!-- Bu yerga o'z rasm manzilingizni qo'ying -->
            <img src="{% static 'img/mp.JPG' %}" alt="Loyiha Rahbari">

            <div class="founder-overlay">
                <span class="founder-name">Asror Azam</span>
                <span class="founder-title">Loyiha Rahbari & Asoschi</span>
            </div>
        </div>

    </div>

</body>
</html>
